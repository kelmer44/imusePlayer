# SPDX-License-Identifier: GPL-3.0-or-later
#
# Every commit pushed to the main branch builds the installers (macOS .dmg, Windows .msi) and publishes them on
# the "Latest" release, whose `latest` tag is moved to that commit. Download names never change, so links keep working.
name: Publish latest

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

# One publish at a time; if several commits arrive, only the newest waits its turn.
concurrency:
  group: publish-latest
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # Apple Silicon
            task: packageDmg
            pattern: "build/compose/binaries/main/dmg/*.dmg"
            out: MI2-Music-Explorer-macos-arm64.dmg
            platform: macos-arm64
          - os: windows-latest      # WiX is preinstalled on the runner
            task: packageMsi
            pattern: "build/compose/binaries/main/msi/*.msi"
            out: MI2-Music-Explorer-windows.msi
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Package
        shell: bash
        # jpackage wants MAJOR.MINOR.PATCH with MAJOR > 0 on macOS; the run number makes every build's version distinct.
        run: ./gradlew ${{ matrix.task }} -PappVersion=1.0.${{ github.run_number }} --no-daemon

      - name: Name the installer
        shell: bash
        run: |
          set -euo pipefail
          src=$(ls ${{ matrix.pattern }} | head -n 1)
          mkdir -p dist
          cp "$src" "dist/${{ matrix.out }}"

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: dist

      - name: Move the latest tag and replace the Latest release
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          short=$(git rev-parse --short HEAD)
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          gh release delete latest --yes 2>/dev/null || true
          gh release create latest dist/* \
            --title "Latest ($short)" \
            --notes "Built from commit $short on $GITHUB_REF_NAME (build ${{ github.run_number }}).

          ${MESSAGE:-Manual run}

          Installers are not code-signed, so macOS and Windows will warn the first time you open them."
